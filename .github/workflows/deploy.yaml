
name: Pulsewatch CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================
  # CI - CONTINUOUS INTEGRATION
  # =========================

  ci:
    name: CI - Build and Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Validate Docker image
        run: docker build -t pulsewatch:ci .

  # =========================
  # CD - CONTINUOUS DEPLOYMENT
  # =========================

  cd:
    name: CD - Deploy to AWS EC2
    runs-on: ubuntu-latest

    # CD runs ONLY when CI succeeds
    needs: ci

    # Deploy only after a push to main, not a pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /home/devops_deploy_engineer/workspace/devops-practice

            echo "Fetching latest code..."
            git fetch origin main

            echo "Updating production source..."
            git merge --ff-only origin/main

            echo "Building and deploying application..."
            docker compose up -d --build --no-deps app

            echo "Checking application..."
            docker compose ps app

            echo "Deployment completed!"
